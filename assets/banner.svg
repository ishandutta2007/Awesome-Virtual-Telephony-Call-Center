cap="round" stroke-width="3"/><line x1="100" x2="100" y1="-6" y2="10" stroke="#38bdf8" stroke-linecap="round" stroke-width="3"/><line x1="120" x2="120" y1="0" y2="6" stroke="#38bdf8" stroke-linecap="round" stroke-width="3"/></g></svg>