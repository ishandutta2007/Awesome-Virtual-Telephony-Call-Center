<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Animated dynamic wave paths */
    @keyframes pulseWaves {
      0% { transform: scaleY(0.8) translateY(10px); opacity: 0.25; }
      50% { transform: scaleY(1.2) translateY(-10px); opacity: 0.55; }
      100% { transform: scaleY(0.8) translateY(10px); opacity: 0.25; }
    }
    @keyframes pulsePulseRing {
      0% { r: 6px; opacity: 0.9; }
      50% { r: 18px; opacity: 0.2; }
      100% { r: 6px; opacity: 0.9; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    @keyframes signalDash {
      to { stroke-dashoffset: -40; }
    }
    .wave1 { animation: pulseWaves 6s ease-in-out infinite; transform-origin: center bottom; }
    .wave2 { animation: pulseWaves 8s ease-in-out infinite reverse; transform-origin: center bottom; }
    .pulse-ring { animation: pulsePulseRing 3s ease-in-out infinite; }
    .pulse-ring-delayed { animation: pulsePulseRing 3.5s ease-in-out infinite 1s; }
    .pill { animation: floatPill 4s ease-in-out infinite; }
    .pill-delayed { animation: floatPill 4.5s ease-in-out infinite 1.5s; }
    .flow-line { stroke-dasharray: 6 6; animation: signalDash 1.8s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)"/>

  <!-- Subtle Network Mesh & Dot Grid in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.7">
    <line x1="100" y1="40" x2="1100" y2="40" stroke-dasharray="4 8"/>
    <line x1="100" y1="120" x2="1100" y2="120" stroke-dasharray="4 8"/>
    <line x1="100" y1="200" x2="1100" y2="200" stroke-dasharray="4 8"/>
    <line x1="100" y1="280" x2="1100" y2="280" stroke-dasharray="4 8"/>
    <line x1="200" y1="20" x2="200" y2="340" stroke-dasharray="4 8"/>
    <line x1="400" y1="20" x2="400" y2="340" stroke-dasharray="4 8"/>
    <line x1="600" y1="20" x2="600" y2="340" stroke-dasharray="4 8"/>
    <line x1="800" y1="20" x2="800" y2="340" stroke-dasharray="4 8"/>
    <line x1="1000" y1="20" x2="1000" y2="340" stroke-dasharray="4 8"/>
  </g>

  <!-- Dynamic Ambient Audio / VoIP Waveforms (Strictly Kept in Lower Background) -->
  <g class="wave1" opacity="0.25">
    <path d="M0,320 Q150,260 300,310 T600,280 T900,320 T1200,290 L1200,360 L0,360 Z" fill="url(#accentPulse)"/>
  </g>
  <g class="wave2" opacity="0.2">
    <path d="M0,330 Q200,270 400,325 T800,295 T1200,330 L1200,360 L0,360 Z" fill="#818cf8"/>
  </g>

  <!-- Left Dynamic Signal Telephony Node (Background Decorative) -->
  <g transform="translate(100, 110)">
    <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" opacity="0.8"/>
    <circle class="pulse-ring" cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#nodeGlow)"/>
    <!-- Phone / Antenna Icon -->
    <path d="M-8,-10 C-4,-14 4,-14 8,-10 M-12,-14 C-6,-20 6,-20 12,-14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6,2 L-2,6 C3,1 5,3 8,6 C6,9 1,11 -4,6 C-9,1 -7,-4 -4,-6 L0,-2" fill="#38bdf8" transform="translate(-1, 0) scale(0.9)"/>
  </g>

  <!-- Right Dynamic AI Voice Node (Background Decorative) -->
  <g transform="translate(1100, 110)">
    <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
    <circle class="pulse-ring-delayed" cx="0" cy="0" r="10" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#c084fc" filter="url(#nodeGlow)"/>
    <!-- Headset / Wave Icon -->
    <path d="M-10,-2 C-10,-9 -4,-13 0,-13 C4,-13 10,-9 10,-2 L10,6 C10,8 8,10 6,10 L4,10" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <rect x="-13" y="1" width="5" height="8" rx="2" fill="#c084fc"/>
    <rect x="8" y="1" width="5" height="8" rx="2" fill="#c084fc"/>
  </g>

  <!-- Flow lines connecting nodes to header center (underneath text) -->
  <path class="flow-line" d="M140,110 Q320,80 500,100" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
  <path class="flow-line" d="M1060,110 Q880,80 700,100" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5"/>

  <!-- Central Foreground Content (Title, Subtitle & Interactive Badge Pills) -->
  <g id="header-text">
    <!-- Top Category Kicker -->
    <text x="600" y="70" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="3">
      VOIP • CLOUD PBX • CCaaS • WEBRTC • SIP • AI AGENTS
    </text>

    <!-- Main Title (Clear Foreground, No Obscuring Elements) -->
    <text x="600" y="125" text-anchor="middle" fill="url(#titleGrad)" font-size="38" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Virtual Telephony &amp; Call Center
    </text>

    <!-- Subtitle (Clear Foreground) -->
    <text x="600" y="165" text-anchor="middle" fill="url(#subGrad)" font-size="16" font-weight="400">
      The Curated Master Index of Enterprise SaaS Platforms &amp; Self-Hosted Open-Source Software
    </text>
  </g>

  <!-- Floating Feature Pills (Nicely Spaced in Lower Area, Never Covering Text) -->
  <g transform="translate(600, 230)" text-anchor="middle">
    <!-- Pill 1: Inbound ACD -->
    <g class="pill" transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad1)" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="-62" cy="0" r="5" fill="#38bdf8"/>
      <text x="5" y="5" fill="#e0f2fe" font-size="12" font-weight="600">🎧 Inbound ACD Queues</text>
    </g>

    <!-- Pill 2: Outbound Predictive -->
    <g class="pill-delayed" transform="translate(-180, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad1)" stroke="#4f46e5" stroke-width="1.2"/>
      <circle cx="-62" cy="0" r="5" fill="#818cf8"/>
      <text x="5" y="5" fill="#e0e7ff" font-size="12" font-weight="600">⚡ Predictive Dialing</text>
    </g>

    <!-- Pill 3: WebRTC & SIP -->
    <g class="pill" transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad1)" stroke="#9333ea" stroke-width="1.2"/>
      <circle cx="-62" cy="0" r="5" fill="#c084fc"/>
      <text x="5" y="5" fill="#f3e8ff" font-size="12" font-weight="600">🌐 WebRTC &amp; SIP Trunk</text>
    </g>

    <!-- Pill 4: AI Voice Agents -->
    <g class="pill-delayed" transform="translate(180, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad1)" stroke="#ec4899" stroke-width="1.2"/>
      <circle cx="-62" cy="0" r="5" fill="#f472b6"/>
      <text x="5" y="5" fill="#fce7f3" font-size="12" font-weight="600">🤖 Conversational AI</text>
    </g>

    <!-- Pill 5: Cloud PBX -->
    <g class="pill" transform="translate(360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad1)" stroke="#059669" stroke-width="1.2"/>
      <circle cx="-62" cy="0" r="5" fill="#34d399"/>
      <text x="5" y="5" fill="#d1fae5" font-size="12" font-weight="600">📞 Cloud Multi-Tenant</text>
    </g>
  </g>

  <!-- Live Audio Spectrum Simulator (Subtle dynamic visualizer in lower center) -->
  <g transform="translate(600, 290)">
    <line x1="-120" y1="0" x2="-120" y2="8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-100" y1="-5" x2="-100" y2="12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="-12" x2="-80" y2="18" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-60" y1="-18" x2="-60" y2="22" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="-10" x2="-40" y2="15" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <line x1="-20" y1="-22" x2="-20" y2="26" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-26" x2="0" y2="30" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="20" y2="24" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="-14" x2="40" y2="17" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="-22" x2="60" y2="24" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="-12" x2="80" y2="16" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="-6" x2="100" y2="10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="0" x2="120" y2="6" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
