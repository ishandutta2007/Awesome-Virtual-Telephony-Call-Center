<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0a0f1d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-radius:12px;overflow:hidden"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1527"/><stop offset="50%" stop-color="#0a0f1d"/><stop offset="100%" stop-color="#070a14"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="accentPulse" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="nodeGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseWaves{0%{transform:scaleY(.8) translateY(10px);opacity:.25}50%{transform:scaleY(1.2) translateY(-10px);opacity:.55}}@keyframes pulsePulseRing{0%{r:6px;opacity:.9}50%{r:18px;opacity:.2}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.wave1,.wave2{animation:pulseWaves 6s ease-in-out infinite;transform-origin:center bottom}.wave2{animation:pulseWaves 8s ease-in-out infinite reverse}.pulse-ring{animation:pulsePulseRing 3s ease-in-out infinite}.pulse-ring-delayed{animation:pulsePulseRing 3.5s ease-in-out infinite 1s}.pill{animation:floatPill 4s ease-in-out infinite}.pill-delayed{animation:floatPill 4.5s ease-in-out infinite 1.5s}.flow-line{stroke-dasharray:6 6;animation:signalDash 1.8s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGlow)"/><g stroke="#38bdf8" stroke-width=".7" opacity=".12"><line x1="100" x2="1100" y1="40" y2="40" stroke-dasharray="4 8"/><line x1="100" x2="1100" y1="120" y2="120" stroke-dasharray="4 8"/><line x1="100" x2="1100" y1="200" y2="200" stroke-dasharray="4 8"/><line x1="100" x2="1100" y1="280" y2="280" stroke-dasharray="4 8"/><line x1="200" x2="200" y1="20" y2="340" stroke-dasharray="4 8"/><line x1="400" x2="400" y1="20" y2="340" stroke-dasharray="4 8"/><line x1="600" x2="600" y1="20" y2="340" stroke-dasharray="4 8"/><line x1="800" x2="800" y1="20" y2="340" stroke-dasharray="4 8"/><line x1="1000" x2="1000" y1="20" y2="340" stroke-dasharray="4 8"/></g><g class="wave1" opacity=".25"><path fill="url(#accentPulse)" d="M0,320 Q150,260 300,310 T600,280 T900,320 T1200,290 L1200,360 L0,360 Z"/></g><g class="wave2" opacity=".2"><path fill="#818cf8" d="M0,330 Q200,270 400,325 T800,295 T1200,330 L1200,360 L0,360 Z"/></g><g transform="translate(100, 110)"><circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" opacity=".8"/><circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse-ring"/><circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#nodeGlow)"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="2" d="M-8,-10 C-4,-14 4,-14 8,-10 M-12,-14 C-6,-20 6,-20 12,-14"/><path fill="#38bdf8" d="M-6,2 L-2,6 C3,1 5,3 8,6 C6,9 1,11 -4,6 C-9,1 -7,-4 -4,-6 L0,-2" transform="translate(-1, 0) scale(0.9)"/></g><g transform="translate(1100, 110)"><circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity=".8"/><circle cx="0" cy="0" r="10" fill="none" stroke="#c084fc" stroke-width="2" class="pulse-ring-delayed"/><circle cx="0" cy="0" r="5" fill="#c084fc" filter="url(#nodeGlow)"/><path fill="none" stroke="#c084fc" stroke-linecap="round" stroke-width="2" d="M-10,-2 C-10,-9 -4,-13 0,-13 C4,-13 10,-9 10,-2 L10,6 C10,8 8,10 6,10 L4,10"/><rect width="5" height="8" x="-13" y="1" fill="#c084fc" rx="2"/><rect width="5" height="8" x="8" y="1" fill="#c084fc" rx="2"/></g><path fill="none" stroke="#0ea5e9" stroke-width="2" d="M140,110 Q320,80 500,100" class="flow-line" opacity=".5"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M1060,110 Q880,80 700,100" class="flow-line" opacity=".5"/><g id="header-text"><text x="600" y="70" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">VOIP • CLOUD PBX • CCaaS • WEBRTC • SIP • AI AGENTS</text><text x="600" y="125" fill="url(#titleGrad)" filter="url(#softGlow)" font-size="38" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Virtual Telephony &amp; Call Center</text><text x="600" y="165" fill="url(#subGrad)" font-size="16" font-weight="400" text-anchor="middle">The Curated Master Index of Enterprise SaaS Platforms &amp; Self-Hosted Open-Source Software</text></g><g text-anchor="middle"><g class="pill" transform="translate(600, 230) translate(-360, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#pillGrad1)" stroke="#0284c7" stroke-width="1.2" rx="18"/><circle cx="-62" cy="0" r="5" fill="#38bdf8"/><text x="5" y="5" fill="#e0f2fe" font-size="12" font-weight="600">🎧 Inbound ACD Queues</text></g><g class="pill-delayed" transform="translate(600, 230) translate(-180, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#pillGrad1)" stroke="#4f46e5" stroke-width="1.2" rx="18"/><circle cx="-62" cy="0" r="5" fill="#818cf8"/><text x="5" y="5" fill="#e0e7ff" font-size="12" font-weight="600">⚡ Predictive Dialing</text></g><g class="pill" transform="translate(600, 230) translate(0, 0)">